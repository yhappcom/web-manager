# ENGINEERING HANDOFF ONLY. Do NOT copy into LogMate unchanged.
# Requires Engineering to vendor/review Web Manager 509/512 Python gates under
# tool/release_gate/ and execute their tests in the product's pinned toolchain.
# Deliberately no deploy, promotion, secrets, environments or production PASS.
name: PROPOSAL - NORMAL PWA G1-G2 transport and semantic round trip
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proposed-normal-custody-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  normal-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      zip_id: ${{ steps.upload_zip.outputs.artifact-id }}
      receipt_id: ${{ steps.upload_receipt.outputs.artifact-id }}
      zip_wrapper_digest: ${{ steps.upload_zip.outputs.artifact-digest }}
      receipt_wrapper_digest: ${{ steps.upload_receipt.outputs.artifact-digest }}
      zip_sha256: ${{ steps.package.outputs.zip_sha256 }}
      receipt_sha256: ${{ steps.package.outputs.receipt_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify approved Stage C font bundle (existing product gate)
        env:
          FONT_ZIP: third_party/fonts/stage-c/logmate-font-stage-3.47.5-stage-c-compliance-final.zip
          FONT_SHA: e83c28c317854fcf04a62033fe474b56424dd7374f6d0f92c4e83c6d72459a87
        run: |
          set -euo pipefail
          test -f "$FONT_ZIP"
          echo "$FONT_SHA  $FONT_ZIP" | sha256sum --check --status
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
      - name: Product prerequisites and NORMAL-only build
        run: |
          set -euo pipefail
          python3 tool/ci_verify_flutter_sdk.py
          flutter pub get
          git diff --exit-code -- pubspec.lock
          dart format --output=none --set-exit-if-changed \
            tool/precache_flutter_web.dart tool/pwa_precache.dart tool/verify_pwa_artifact.dart
          BUILD_WEB_OUTPUT=build/web-normal make build-pwa
          git diff --check
      - name: Freeze NORMAL receipt and wrap full file tree as one inner ZIP
        id: package
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/normal-custody"
          python3 tool/release_gate/pwa_release_custody_gate.py freeze \
            --root build/web-normal --kind normal --source-sha "$GITHUB_SHA" \
            --receipt "$RUNNER_TEMP/normal-custody/receipt.json"
          python3 - <<'PY'
          import json, os, pathlib, stat, zipfile
          base = pathlib.Path('build/web-normal')
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'normal-custody/normal.zip'
          receipt = json.loads((out.parent / 'receipt.json').read_text())
          with zipfile.ZipFile(out, 'x', compression=zipfile.ZIP_STORED, allowZip64=True) as z:
              for rel in sorted(receipt['files']):
                  src = base / rel
                  if not src.is_file() or src.is_symlink():
                      raise SystemExit('invalid source path: ' + rel)
                  info = zipfile.ZipInfo(rel, date_time=(1980, 1, 1, 0, 0, 0))
                  info.create_system = 3
                  info.external_attr = (stat.S_IFREG | 0o644) << 16
                  info.compress_type = zipfile.ZIP_STORED
                  z.writestr(info, src.read_bytes())
          PY
          python3 tool/release_gate/pwa_archive_transport_gate.py \
            --archive "$RUNNER_TEMP/normal-custody/normal.zip" \
            --receipt "$RUNNER_TEMP/normal-custody/receipt.json" \
            --archive-sha256 "$(sha256sum "$RUNNER_TEMP/normal-custody/normal.zip" | cut -d' ' -f1)" \
            --receipt-sha256 "$(sha256sum "$RUNNER_TEMP/normal-custody/receipt.json" | cut -d' ' -f1)" \
            --source-sha "$GITHUB_SHA"
          echo "zip_sha256=$(sha256sum "$RUNNER_TEMP/normal-custody/normal.zip" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "receipt_sha256=$(sha256sum "$RUNNER_TEMP/normal-custody/receipt.json" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Upload INNER NORMAL ZIP as a single file (v4 wrapper is separate)
        id: upload_zip
        uses: actions/upload-artifact@v4
        with:
          name: normal-inner-zip-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/normal-custody/normal.zip
          if-no-files-found: error
          retention-days: 7
      - name: Upload receipt separately (not independent release approval)
        id: upload_receipt
        uses: actions/upload-artifact@v4
        with:
          name: normal-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/normal-custody/receipt.json
          if-no-files-found: error
          retention-days: 7

  normal-roundtrip:
    needs: normal-build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download pinned ZIP artifact ID (v4 unwraps to normal.zip)
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.normal-build.outputs.zip_id }}
          path: ${{ runner.temp }}/received-zip
      - name: Download pinned receipt artifact ID
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.normal-build.outputs.receipt_id }}
          path: ${{ runner.temp }}/received-receipt
      - name: Fatal transport oracle, safe staging and 509 semantic recheck
        env:
          ZIP_PIN: ${{ needs.normal-build.outputs.zip_sha256 }}
          RECEIPT_PIN: ${{ needs.normal-build.outputs.receipt_sha256 }}
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/received-zip/normal.zip"
          RECEIPT="$RUNNER_TEMP/received-receipt/receipt.json"
          test -f "$ZIP" && test -f "$RECEIPT"
          echo "$ZIP_PIN  $ZIP" | sha256sum --check --status
          echo "$RECEIPT_PIN  $RECEIPT" | sha256sum --check --status
          python3 tool/release_gate/pwa_archive_transport_gate.py \
            --archive "$ZIP" --receipt "$RECEIPT" \
            --archive-sha256 "$ZIP_PIN" --receipt-sha256 "$RECEIPT_PIN" \
            --source-sha "$GITHUB_SHA"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil, zipfile, sys
          sys.path.insert(0, 'tool/release_gate')
          from pwa_archive_transport_gate import safe_path
          src = pathlib.Path(os.environ['RUNNER_TEMP']) / 'received-zip/normal.zip'
          receipt = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'received-receipt/receipt.json').read_text())
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'normal-restored'
          root.mkdir(exist_ok=False)
          seen = set()
          with zipfile.ZipFile(src) as z:
              for entry in z.infolist():
                  rel = safe_path(entry.filename, directory=entry.is_dir())
                  if entry.is_dir():
                      continue
                  if rel in seen or rel not in receipt['files']:
                      raise SystemExit('unexpected ZIP entry')
                  seen.add(rel)
                  dest = root / rel
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  with z.open(entry) as source, dest.open('xb') as target:
                      shutil.copyfileobj(source, target, length=1024*1024)
          if seen != set(receipt['files']):
              raise SystemExit('missing ZIP entries')
          if hashlib.sha256(src.read_bytes()).hexdigest() != os.environ['ZIP_PIN']:
              raise SystemExit('ZIP changed during extraction')
          PY
          python3 tool/release_gate/pwa_release_custody_gate.py verify \
            --root "$RUNNER_TEMP/normal-restored" --kind normal \
            --source-sha "$GITHUB_SHA" --receipt "$RECEIPT"
          echo 'G2_PRODUCER_SCOPED_TRANSPORT_AND_SEMANTIC_MATCH; NOT G3/G4/G5' >> "$GITHUB_STEP_SUMMARY"
