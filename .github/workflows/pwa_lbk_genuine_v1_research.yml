name: PWA LBK genuine v1 interchange research (read-only)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pwa_lbk_genuine_v1_research.yml
      - research/handoffs/lbk_genuine_v1_independent_node_oracle.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  genuine-lbk-v1:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout Web Manager research at triggering SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout pinned read-only LogMate source and genuine fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yhappcom/logmate
          ref: d3bc214fe9b4b7bf84702f898b4e6993a4127e2f
          path: source-logmate
          persist-credentials: false
          fetch-depth: 1
      - name: Install exact Node runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.16.0
          package-manager-cache: false
      - name: Pin and execute independent genuine-fixture oracle
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source-logmate rev-parse HEAD)" = d3bc214fe9b4b7bf84702f898b4e6993a4127e2f
          test "$(git -C source-logmate hash-object test/fixtures/f1_v16_populated_format_v1.lbk)" = e702040503997f5f6c8cf099314c5607537d864c
          node --version
          node --check research/handoffs/lbk_genuine_v1_independent_node_oracle.mjs
          node --test research/handoffs/lbk_genuine_v1_independent_node_oracle.mjs
