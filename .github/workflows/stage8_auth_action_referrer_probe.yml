name: Stage 8 Auth Action Referrer Privacy Research
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/handoffs/stage8_auth_action_referrer_probe.py'
      - '.github/workflows/stage8_auth_action_referrer_probe.yml'
permissions:
  contents: read
jobs:
  synthetic-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install exact Playwright Python
        run: python -m pip install playwright==1.57.0
      - name: Record browser and verify probe syntax
        run: |
          python --version
          python -m pip show playwright
          command -v google-chrome
          google-chrome --version
          python -m py_compile research/handoffs/stage8_auth_action_referrer_probe.py
      - name: Run synthetic referrer negative controls
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
          EVIDENCE_OUT: /tmp/stage8-auth-referrer-evidence.json
        run: python research/handoffs/stage8_auth_action_referrer_probe.py
      - name: Upload bounded synthetic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage8-auth-referrer-evidence
          path: /tmp/stage8-auth-referrer-evidence.json
          if-no-files-found: ignore
