name: Stage 8 public synthetic oracles

# Public, self-contained research-only models. No private LogMate checkout or secrets.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/handoffs/pwa_sync_identity_order_lab.mjs'
      - 'research/handoffs/pwa_lww_clock_policy_model.mjs'
      - 'research/handoffs/lbk_json_interop_ambiguity_lab.mjs'
      - 'research/handoffs/lbk_restore_hold_collision_lab.mjs'
      - '.github/workflows/stage8_public_synthetic_oracles.yml'

permissions:
  contents: read

concurrency:
  group: stage8-public-oracles-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bounded-models:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
      - name: Evidence boundary and source SHA
        run: |
          echo "RESEARCH ONLY: public synthetic models, not LogMate product or managed EFB."
          node --version
          git rev-parse HEAD
      - name: Check syntax of all public models
        run: |
          node --check research/handoffs/pwa_sync_identity_order_lab.mjs
          node --check research/handoffs/pwa_lww_clock_policy_model.mjs
          node --check research/handoffs/lbk_json_interop_ambiguity_lab.mjs
          node --check research/handoffs/lbk_restore_hold_collision_lab.mjs
      - name: LWW identity and Unicode - exactly 18 checks
        run: |
          node research/handoffs/pwa_sync_identity_order_lab.mjs | tee /tmp/stage8-identity.log
          grep -Fq '18/18 PASS' /tmp/stage8-identity.log
      - name: UTC clock and tombstones - exactly 20 checks
        run: |
          node research/handoffs/pwa_lww_clock_policy_model.mjs | tee /tmp/stage8-clock.log
          grep -Fq '"tests": 20' /tmp/stage8-clock.log
          grep -Fq '"passed": 20' /tmp/stage8-clock.log
      - name: JSON semantic ambiguity - exactly 13 checks
        run: |
          node research/handoffs/lbk_json_interop_ambiguity_lab.mjs | tee /tmp/stage8-json.log
          grep -Fq 'SYNTHETIC_NODE_JSON_DIAGNOSTIC 13/13 PASS' /tmp/stage8-json.log
      - name: Restore hold-key model - exactly 10 tests
        run: |
          node --test research/handoffs/lbk_restore_hold_collision_lab.mjs | tee /tmp/stage8-restore.log
          grep -Fq '# tests 10' /tmp/stage8-restore.log
          grep -Fq '# pass 10' /tmp/stage8-restore.log
          grep -Fq '# fail 0' /tmp/stage8-restore.log
      - name: Evidence limitation
        if: always()
        run: echo "Model green != product validation; PWA release HOLD."
