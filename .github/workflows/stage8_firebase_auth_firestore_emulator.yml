name: Stage 8 Firebase Auth Firestore Emulator Admission (research only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/handoffs/firebase_auth_firestore_admission_probe/**'
      - '.github/workflows/stage8_firebase_auth_firestore_emulator.yml'
permissions:
  contents: read
jobs:
  admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: research/handoffs/firebase_auth_firestore_admission_probe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned direct dependencies
        run: npm install --no-audit --no-fund
      - name: Record environment and dependency resolution
        run: |
          node --version
          java -version
          npm ls --depth=0
          npx firebase --version
          node --check admission_probe.mjs
      - name: Run Auth + Firestore emulator integration oracle
        env:
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
          GCLOUD_PROJECT: demo-web-manager-auth
          CI: 'true'
        run: npx firebase emulators:exec --only auth,firestore --project demo-web-manager-auth "node --test admission_probe.mjs"
