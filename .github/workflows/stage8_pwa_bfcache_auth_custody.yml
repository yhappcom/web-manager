name: Stage 8 PWA BFCache Auth Custody (Synthetic)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/handoffs/pwa_bfcache_auth_custody_probe.py'
      - '.github/workflows/stage8_pwa_bfcache_auth_custody.yml'
permissions:
  contents: read
jobs:
  chrome-bfcache-custody:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install playwright==1.57.0
      - name: Compile and record browser
        run: |
          python -m py_compile research/handoffs/pwa_bfcache_auth_custody_probe.py
          google-chrome --version
      - name: Execute synthetic BFCache probe
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
          EVIDENCE_OUT: /tmp/pwa-bfcache-evidence.json
          HEADLESS: '0'
        run: xvfb-run -a python research/handoffs/pwa_bfcache_auth_custody_probe.py
      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pwa-bfcache-auth-custody-evidence
          path: /tmp/pwa-bfcache-evidence.json
          if-no-files-found: ignore
