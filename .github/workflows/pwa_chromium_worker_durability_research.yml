name: PWA Chromium worker durability research (synthetic localhost only)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pwa_chromium_worker_durability_research.yml
      - research/handoffs/pwa_chromium_worker_durability_lab.mjs
      - research/handoffs/test_pwa_chromium_worker_durability_lab.mjs
      - research/handoffs/pwa_chromium_csp_runtime_lab.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-local-only:
    name: Worker lifecycle and cold-offline synthetic research
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Install pinned Node runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.16.0
          package-manager-cache: false
      - name: Syntax and independent negative-control contract tests
        shell: bash
        run: |
          set -euo pipefail
          node --check research/handoffs/pwa_chromium_worker_durability_lab.mjs
          node --check research/handoffs/test_pwa_chromium_worker_durability_lab.mjs
          node --test research/handoffs/test_pwa_chromium_worker_durability_lab.mjs
      - name: Real Chromium localhost Worker and storage lifecycle
        shell: bash
        run: |
          set -euo pipefail
          if command -v google-chrome >/dev/null 2>&1; then
            export CHROME_PATH="$(command -v google-chrome)"
          elif command -v chromium >/dev/null 2>&1; then
            export CHROME_PATH="$(command -v chromium)"
          else
            echo "No Chromium executable; browser tier UNKNOWN"
            exit 2
          fi
          "$CHROME_PATH" --version
          node research/handoffs/pwa_chromium_worker_durability_lab.mjs
