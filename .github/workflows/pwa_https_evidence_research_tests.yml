name: PWA HTTPS evidence collector research tests

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pwa_https_evidence_research_tests.yml
      - research/handoffs/pwa_https_evidence_collector.js
      - research/handoffs/test_pwa_https_evidence_collector.js
      - research/handoffs/pwa_served_header_evidence_gate.js
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collector-unit-tests:
    name: Read-only synthetic evidence-gate tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Install Node 22 test runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.16.0
          package-manager-cache: false
      - name: Run exact synthetic regression suites
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node --check research/handoffs/pwa_https_evidence_collector.js
          node --check research/handoffs/test_pwa_https_evidence_collector.js
          node --check research/handoffs/pwa_served_header_evidence_gate.js
          node --test research/handoffs/test_pwa_https_evidence_collector.js
          node research/handoffs/pwa_served_header_evidence_gate.js --self-test
