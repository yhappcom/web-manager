name: Stage 8 PWA Browser CORS and Admission Boundary (Synthetic)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/handoffs/pwa_cors_admission_browser_probe.py'
      - '.github/workflows/stage8_pwa_browser_cors_admission.yml'
permissions:
  contents: read
jobs:
  chrome-cors-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install pinned Playwright
        run: python -m pip install playwright==1.57.0
      - name: Record environment and compile
        run: |
          python --version
          google-chrome --version
          python -m py_compile research/handoffs/pwa_cors_admission_browser_probe.py
      - name: Execute isolated browser admission probe
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
          EVIDENCE_OUT: /tmp/pwa-cors-admission-evidence.json
        run: python research/handoffs/pwa_cors_admission_browser_probe.py
      - name: Preserve bounded evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pwa-cors-admission-evidence
          path: /tmp/pwa-cors-admission-evidence.json
          if-no-files-found: ignore
