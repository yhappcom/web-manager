name: Stage 8 PWA Cached Header Integrity (Synthetic)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/handoffs/pwa_cached_header_integrity_probe.py'
      - '.github/workflows/stage8_pwa_cached_header_integrity.yml'
permissions:
  contents: read
jobs:
  cached-header-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install playwright==1.57.0
      - name: Compile and record Chrome
        run: |
          python -m py_compile research/handoffs/pwa_cached_header_integrity_probe.py
          google-chrome --version
      - name: Execute cached-header integrity comparison
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
          EVIDENCE_OUT: /tmp/pwa-cached-header-integrity.json
        run: python research/handoffs/pwa_cached_header_integrity_probe.py
      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pwa-cached-header-integrity-evidence
          path: /tmp/pwa-cached-header-integrity.json
          if-no-files-found: ignore
